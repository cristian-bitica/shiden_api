name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Type-check with mypy
        run: uv run mypy src

      # Integration tests are deliberately NOT run here: they require live
      # network access (OPCOM/BNR/ECB) and a local Bronze Delta snapshot
      # (data/ is gitignored). Run locally with: pytest -m integration
      - name: Run unit tests
        run: uv run pytest tests/unit -v
